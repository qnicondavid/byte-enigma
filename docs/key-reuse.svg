  <text x="8" y="160" font-size="16" fill="#bf8700">107 of 117 match, and nobody had to touch the key to see it.</text>
  <text x="8" y="184" font-size="13" fill="#7d8590">The gaps are the whole of what stayed hidden: they are where the messages differ.</text>
  <text x="8" y="206" font-size="13" fill="#2f9e57">Seal each message with a fresh nonce and the row goes dark.</text>
