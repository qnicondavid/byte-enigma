  <text x="96" y="176" font-size="16" fill="#bf8700">107 of 117 match, and nobody had to touch the key to see it.</text>
  <text x="96" y="200" font-size="13" fill="#7d8590">The gaps are the whole of what stayed hidden: they are where the messages differ.</text>
  <text x="96" y="222" font-size="13" fill="#2f9e57">Seal each message with a fresh nonce and the row goes dark.</text>
