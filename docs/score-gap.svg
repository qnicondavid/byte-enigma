  <circle cx="344" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="333" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="327" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="290" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <text x="96" y="306" font-size="12" fill="#7d8590">3.04 log-units</text>
  <text x="96" y="322" font-size="12" fill="#7d8590">from end to end,</text>
  <text x="96" y="338" font-size="12" fill="#7d8590">and no English</text>
  <text x="96" y="354" font-size="12" fill="#7d8590">in any of them</text>
</svg>
