<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img"
     aria-labelledby="gap-title gap-desc">
  <title id="gap-title">The margin between the key and every other key</title>
  <desc id="gap-desc">A score axis from minus 1850 to minus 1600. The nine next best keys out of
    4,294,967,296 sit in one clump near minus 1828 and span 3.04 log-units between them. The true
    key sits far to the right at -1620.38, a margin of 206.39. A second axis below magnifies the
    clump so the nine can be told apart.</desc>

  <text x="8" y="26" font-size="15" fill="#8b949e">4,294,967,296 keys tried, from the ciphertext alone.</text>
  <text x="8" y="48" font-size="13" fill="#7d8590">Further right means the bytes that came out read more like English.</text>

  <path d="M 88 152 L 88 108 L 802 108 L 802 152" fill="none" stroke="#bf8700" stroke-width="1.5"/>
  <text x="445" y="96" font-size="16" fill="#bf8700" text-anchor="middle">a margin of 206.39 log-units</text>

  <line x1="8" y1="168" x2="872" y2="168" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="8" y1="168" x2="8" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="8" y="192" font-size="11" fill="#7d8590" text-anchor="start">-1850</text>
  <line x1="181" y1="168" x2="181" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="181" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1800</text>
  <line x1="354" y1="168" x2="354" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="354" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1750</text>
  <line x1="526" y1="168" x2="526" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="526" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1700</text>
  <line x1="699" y1="168" x2="699" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="699" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1650</text>
  <line x1="872" y1="168" x2="872" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="872" y="192" font-size="11" fill="#7d8590" text-anchor="end">-1600</text>
  <circle cx="88" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="84" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="83" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="82" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="81" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="79" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="79" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="79" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="78" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="802" cy="168" r="9" fill="#2f9e57"/>
  <text x="88" y="216" font-size="13" fill="#7d8590" text-anchor="middle">nine keys</text>
  <text x="802" y="216" font-size="13" fill="#2f9e57" text-anchor="middle">the key</text>
  <text x="802" y="232" font-size="12" fill="#2f9e57" text-anchor="middle">-1620.38</text>

  <text x="160" y="276" font-size="13" fill="#7d8590">the same nine keys, magnified 54 times</text>
  <line x1="160" y1="318" x2="872" y2="318" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="197" y1="318" x2="197" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="197" y="342" font-size="11" fill="#7d8590" text-anchor="start">-1830</text>
  <line x1="385" y1="318" x2="385" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="385" y="342" font-size="11" fill="#7d8590" text-anchor="middle">-1829</text>
  <line x1="572" y1="318" x2="572" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="572" y="342" font-size="11" fill="#7d8590" text-anchor="middle">-1828</text>
  <line x1="760" y1="318" x2="760" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="760" y="342" font-size="11" fill="#7d8590" text-anchor="end">-1827</text>
  <circle cx="804" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="587" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="527" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="486" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="395" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="314" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="298" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="290" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="234" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <text x="8" y="306" font-size="12" fill="#7d8590">3.04 log-units</text>
  <text x="8" y="322" font-size="12" fill="#7d8590">from end to end,</text>
  <text x="8" y="338" font-size="12" fill="#7d8590">and no English</text>
  <text x="8" y="354" font-size="12" fill="#7d8590">in any of them</text>
</svg>
