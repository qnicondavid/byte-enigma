<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img"
     aria-labelledby="scale-title scale-desc">
  <title id="scale-title">What a longer message costs each attack</title>
  <desc id="scale-desc">Three lines against message length, in microseconds a candidate. The key
    schedule is flat at about 3.6. The crib attack is flat just above it, from 3.799 microseconds at 80
    bytes to 3.825 at 1024, because it decrypts a sixteen-byte window whatever the message length is.
    The ciphertext-only attack climbs from 4.200 to 10.169, because it decrypts all of it, and the shaded
    gap between the two widens from 10.6 percent to 166 percent.</desc>

  <text x="8" y="26" font-size="15" fill="#8b949e">Both attacks pay the key schedule. Only one of them reads the message.</text>
  <text x="8" y="48" font-size="13" fill="#7d8590">Microseconds a candidate, three rotors, against message length in bytes.</text>

  <line x1="31" y1="400" x2="750" y2="400" stroke="#7d8590" stroke-width="1" stroke-opacity="0.25"/>
  <text x="21" y="404" font-size="11" fill="#7d8590" text-anchor="end">0</text>
  <line x1="31" y1="345" x2="750" y2="345" stroke="#7d8590" stroke-width="1" stroke-opacity="0.25"/>
  <text x="21" y="349" font-size="11" fill="#7d8590" text-anchor="end">2</text>
  <line x1="31" y1="291" x2="750" y2="291" stroke="#7d8590" stroke-width="1" stroke-opacity="0.25"/>
  <text x="21" y="295" font-size="11" fill="#7d8590" text-anchor="end">4</text>
  <line x1="31" y1="236" x2="750" y2="236" stroke="#7d8590" stroke-width="1" stroke-opacity="0.25"/>
  <text x="21" y="240" font-size="11" fill="#7d8590" text-anchor="end">6</text>
  <line x1="31" y1="182" x2="750" y2="182" stroke="#7d8590" stroke-width="1" stroke-opacity="0.25"/>
  <text x="21" y="186" font-size="11" fill="#7d8590" text-anchor="end">8</text>
  <line x1="31" y1="127" x2="750" y2="127" stroke="#7d8590" stroke-width="1" stroke-opacity="0.25"/>
  <text x="21" y="131" font-size="11" fill="#7d8590" text-anchor="end">10</text>

  <path d="M 87 285 L 143 273 L 195 262 L 750 123 L 750 296 L 195 298 L 143 296 L 87 296 Z" fill="#bf8700" fill-opacity="0.14"/>

  <polyline points="87,301 143,301 195,301 750,301" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-dasharray="4 4"/>
  <polyline points="87,296 143,296 195,298 750,296" fill="none" stroke="#2f9e57" stroke-width="2.2"/>
  <polyline points="87,285 143,273 195,262 750,123" fill="none" stroke="#bf8700" stroke-width="2.2"/>
  <circle cx="87" cy="296" r="4" fill="#2f9e57"/>
  <circle cx="87" cy="285" r="4" fill="#bf8700"/>
  <circle cx="143" cy="296" r="4" fill="#2f9e57"/>
  <circle cx="143" cy="273" r="4" fill="#bf8700"/>
  <circle cx="195" cy="298" r="4" fill="#2f9e57"/>
  <circle cx="195" cy="262" r="4" fill="#bf8700"/>
  <circle cx="750" cy="296" r="4" fill="#2f9e57"/>
  <circle cx="750" cy="123" r="4" fill="#bf8700"/>

  <line x1="31" y1="400" x2="750" y2="400" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="87" y1="400" x2="87" y2="406" stroke="#7d8590" stroke-width="1"/>
  <text x="87" y="421" font-size="11" fill="#7d8590" text-anchor="start">80</text>
  <line x1="143" y1="400" x2="143" y2="406" stroke="#7d8590" stroke-width="1"/>
  <text x="143" y="421" font-size="11" fill="#7d8590" text-anchor="middle">160</text>
  <line x1="195" y1="400" x2="195" y2="406" stroke="#7d8590" stroke-width="1"/>
  <text x="195" y="421" font-size="11" fill="#7d8590" text-anchor="middle">234</text>
  <line x1="750" y1="400" x2="750" y2="406" stroke="#7d8590" stroke-width="1"/>
  <text x="750" y="421" font-size="11" fill="#7d8590" text-anchor="end">1024</text>

  <text x="87" y="275" font-size="11" fill="#bf8700" text-anchor="middle">10.6%</text>
  <text x="143" y="263" font-size="11" fill="#bf8700" text-anchor="middle">22.0%</text>
  <text x="195" y="252" font-size="11" fill="#bf8700" text-anchor="middle">35.5%</text>
  <text x="734" y="210" font-size="13" fill="#bf8700" text-anchor="end">166% dearer</text>

  <text x="764" y="127" font-size="12" fill="#bf8700">ciphertext only</text>
  <text x="764" y="290" font-size="12" fill="#2f9e57">with a crib</text>
  <text x="764" y="317" font-size="12" fill="#7d8590">rekey only</text>

  <text x="8" y="456" font-size="12" fill="#7d8590">Drawn from docs/benchmarks.json. The dashed line is the key schedule, which neither attack can skip.</text>
</svg>
