  <text x="392" y="342" font-size="11" fill="#7d8590" text-anchor="middle">-1829</text>
  <line x1="518" y1="318" x2="518" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="518" y="342" font-size="11" fill="#7d8590" text-anchor="middle">-1828</text>
  <line x1="644" y1="318" x2="644" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="644" y="342" font-size="11" fill="#7d8590" text-anchor="middle">-1827</text>
  <circle cx="674" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
