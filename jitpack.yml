# Built with the wrapper, so the Maven that runs here is the one pinned in
# .mvn/wrapper/maven-wrapper.properties rather than whatever the build image happens to carry.
# JitPack's default image carries a Maven older than 3.6.3, and the first two builds this file ever
# ran, of v1.2.0 and v1.2.1 on 19 August 2026, both died on the same line: "The plugin
# org.apache.maven.plugins:maven-compiler-plugin:3.13.0 requires Maven version 3.6.3". Only the
# parent pom was published either time.
jdk:
  - openjdk17

install:
  - ./mvnw -B -ntp -DskipTests install
