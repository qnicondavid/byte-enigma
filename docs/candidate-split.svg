<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img"
     aria-labelledby="split-title split-desc">
  <title id="split-title">Where the time in one candidate goes</title>
  <desc id="split-desc">Two bars on one scale, both for a 234-byte message on three rotors. The
    ciphertext-only candidate costs 5.073 microseconds and the crib one 3.743. Both begin with the same
    3.632 microseconds of key schedule, split into the generator at 1.000, its rejection loop at 1.665
    and the rest of the shuffling at 0.967. Only the short end differs: 1.441 microseconds to read the
    whole message and score it, against 0.111 to read the crib window and compare it.</desc>

  <text x="96" y="36" font-size="15" fill="#8b949e">One key tried against a 234-byte message, three rotors.</text>
  <text x="96" y="58" font-size="13" fill="#7d8590">Both attacks build the same machine first. What they do after it is the short end on the right.</text>

  <text x="426" y="80" font-size="13" fill="#8b949e" text-anchor="middle">the key schedule, 3.632 us</text>
  <text x="426" y="96" font-size="12" fill="#7d8590" text-anchor="middle">71.6% of the ciphertext-only bar, 97.0% of the crib one</text>
  <path d="M 200 110 L 200 102 L 651 102 L 651 110" fill="none" stroke="#7d8590" stroke-width="1.4"/>

  <rect x="200" y="118" width="124" height="44" fill="#7d8590" fill-opacity="0.38"/>
  <rect x="327" y="118" width="204" height="44" fill="#bf8700" fill-opacity="0.92"/>
  <rect x="534" y="118" width="117" height="44" fill="#7d8590" fill-opacity="0.66"/>
  <rect x="654" y="118" width="176" height="44" fill="#2f9e57" fill-opacity="0.85"/>
  <rect x="200" y="192" width="124" height="44" fill="#7d8590" fill-opacity="0.38"/>
  <rect x="327" y="192" width="204" height="44" fill="#bf8700" fill-opacity="0.92"/>
  <rect x="534" y="192" width="117" height="44" fill="#7d8590" fill-opacity="0.66"/>
  <rect x="654" y="192" width="11" height="44" fill="#2f9e57" fill-opacity="0.85"/>
  <text x="190" y="145" font-size="13" fill="#8b949e" text-anchor="end">ciphertext only</text>
  <text x="190" y="219" font-size="13" fill="#8b949e" text-anchor="end">with a crib</text>
  <text x="262" y="180" font-size="12" fill="#7d8590" text-anchor="middle">19.7%</text>
  <text x="428" y="180" font-size="12" fill="#bf8700" text-anchor="middle">32.8%</text>
  <text x="591" y="180" font-size="12" fill="#7d8590" text-anchor="middle">19.1%</text>
  <text x="741" y="180" font-size="12" fill="#7d8590" text-anchor="middle">28.4%</text>

  <line x1="200" y1="254" x2="830" y2="254" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="200" y1="254" x2="200" y2="260" stroke="#7d8590" stroke-width="1"/>
  <text x="200" y="275" font-size="11" fill="#7d8590" text-anchor="middle">0</text>
  <line x1="324" y1="254" x2="324" y2="260" stroke="#7d8590" stroke-width="1"/>
  <text x="324" y="275" font-size="11" fill="#7d8590" text-anchor="middle">1</text>
  <line x1="448" y1="254" x2="448" y2="260" stroke="#7d8590" stroke-width="1"/>
  <text x="448" y="275" font-size="11" fill="#7d8590" text-anchor="middle">2</text>
  <line x1="573" y1="254" x2="573" y2="260" stroke="#7d8590" stroke-width="1"/>
  <text x="573" y="275" font-size="11" fill="#7d8590" text-anchor="middle">3</text>
  <line x1="697" y1="254" x2="697" y2="260" stroke="#7d8590" stroke-width="1"/>
  <text x="697" y="275" font-size="11" fill="#7d8590" text-anchor="middle">4</text>
  <line x1="821" y1="254" x2="821" y2="260" stroke="#7d8590" stroke-width="1"/>
  <text x="821" y="275" font-size="11" fill="#7d8590" text-anchor="middle">5</text>
  <text x="200" y="296" font-size="12" fill="#7d8590">microseconds</text>

  <rect x="200" y="326" width="12" height="12" fill="#7d8590" fill-opacity="0.38"/>
  <text x="222" y="336" font-size="12" fill="#7d8590">the generator, 1,275 draws at a power-of-two bound</text>
  <text x="830" y="336" font-size="12" fill="#7d8590" text-anchor="end">1.000 us, 19.7%</text>
  <rect x="200" y="348" width="12" height="12" fill="#bf8700" fill-opacity="0.92"/>
  <text x="222" y="358" font-size="12" fill="#7d8590">the rejection loop, on the bounds a shuffle really uses</text>
  <text x="830" y="358" font-size="12" fill="#7d8590" text-anchor="end">1.665 us, 32.8%</text>
  <rect x="200" y="370" width="12" height="12" fill="#7d8590" fill-opacity="0.66"/>
  <text x="222" y="380" font-size="12" fill="#7d8590">the rest of the shuffling</text>
  <text x="830" y="380" font-size="12" fill="#7d8590" text-anchor="end">0.967 us, 19.1%</text>
  <rect x="200" y="392" width="12" height="12" fill="#2f9e57" fill-opacity="0.85"/>
  <text x="222" y="402" font-size="12" fill="#7d8590">the whole message, decrypted and scored</text>
  <text x="830" y="402" font-size="12" fill="#7d8590" text-anchor="end">1.441 us, 28.4%</text>
  <rect x="200" y="414" width="12" height="12" fill="#2f9e57" fill-opacity="0.85"/>
  <text x="222" y="424" font-size="12" fill="#7d8590">the crib window, decrypted and compared</text>
  <text x="830" y="424" font-size="12" fill="#7d8590" text-anchor="end">0.111 us, 3.0%</text>

  <text x="96" y="456" font-size="12" fill="#7d8590">Drawn from docs/benchmarks.json. Green is the only part that depends on the message. Each share is of the bar it sits in.</text>
</svg>
