<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img"
     aria-labelledby="gap-title gap-desc">
  <title id="gap-title">The margin between the key and every other key</title>
  <desc id="gap-desc">A score axis from minus 1850 to minus 1600. The nine next best keys out of
    4,294,967,296 sit in one clump near minus 1828 and span 3.04 log-units between them. The true
    key sits far to the right at -1620.38, a margin of 206.39. A second axis below magnifies the
    clump so the nine can be told apart.</desc>

  <text x="0" y="26" font-size="15" fill="#8b949e">4,294,967,296 keys tried, from the ciphertext alone.</text>
  <text x="0" y="48" font-size="13" fill="#7d8590">Further right means the bytes that came out read more like English.</text>

  <path d="M 82 152 L 82 108 L 808 108 L 808 152" fill="none" stroke="#bf8700" stroke-width="1.5"/>
  <text x="445" y="96" font-size="16" fill="#bf8700" text-anchor="middle">a margin of 206.39 log-units</text>

  <line x1="0" y1="168" x2="880" y2="168" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="0" y1="168" x2="0" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="0" y="192" font-size="11" fill="#7d8590" text-anchor="start">-1850</text>
  <line x1="176" y1="168" x2="176" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="176" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1800</text>
  <line x1="352" y1="168" x2="352" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="352" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1750</text>
  <line x1="528" y1="168" x2="528" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="528" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1700</text>
  <line x1="704" y1="168" x2="704" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="704" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1650</text>
  <line x1="880" y1="168" x2="880" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="880" y="192" font-size="11" fill="#7d8590" text-anchor="end">-1600</text>
  <circle cx="82" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="78" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="77" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="76" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="74" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="73" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="72" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="72" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="71" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="808" cy="168" r="9" fill="#2f9e57"/>
  <text x="82" y="216" font-size="13" fill="#7d8590" text-anchor="middle">nine keys</text>
  <text x="808" y="216" font-size="13" fill="#2f9e57" text-anchor="middle">the key</text>
  <text x="808" y="232" font-size="12" fill="#2f9e57" text-anchor="middle">-1620.38</text>

  <text x="160" y="276" font-size="13" fill="#7d8590">the same nine keys, magnified 54 times</text>
  <line x1="160" y1="318" x2="880" y2="318" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="198" y1="318" x2="198" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="198" y="342" font-size="11" fill="#7d8590" text-anchor="start">-1830</text>
  <line x1="387" y1="318" x2="387" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="387" y="342" font-size="11" fill="#7d8590" text-anchor="middle">-1829</text>
  <line x1="577" y1="318" x2="577" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="577" y="342" font-size="11" fill="#7d8590" text-anchor="middle">-1828</text>
  <line x1="766" y1="318" x2="766" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="766" y="342" font-size="11" fill="#7d8590" text-anchor="end">-1827</text>
  <circle cx="812" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="592" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="531" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="489" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="398" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="316" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="299" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="291" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="235" cy="318" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <text x="0" y="306" font-size="12" fill="#7d8590">3.04 log-units</text>
  <text x="0" y="322" font-size="12" fill="#7d8590">from end to end,</text>
  <text x="0" y="338" font-size="12" fill="#7d8590">and no English</text>
  <text x="0" y="354" font-size="12" fill="#7d8590">in any of them</text>
</svg>
