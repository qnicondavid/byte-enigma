<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img"
     aria-labelledby="gap-title gap-desc">
  <title id="gap-title">The margin between the key and every other key</title>
  <desc id="gap-desc">A score axis from minus 1850 to minus 1600. The nine next best keys out of
    4,294,967,296 sit in one clump near minus 1828 and span 3.04 log-units between them. The true
    key sits far to the right at -1620.38, a margin of 206.39. A second axis below magnifies the
    clump so the nine can be told apart.</desc>

  <text x="96" y="40" font-size="15" fill="#8b949e">4,294,967,296 keys tried, from the ciphertext alone.</text>
  <text x="96" y="62" font-size="13" fill="#7d8590">Further right means the bytes that came out read more like English.</text>

  <path d="M 161 152 L 161 108 L 743 108 L 743 152" fill="none" stroke="#bf8700" stroke-width="1.5"/>
  <text x="452" y="96" font-size="16" fill="#bf8700" text-anchor="middle">a margin of 206.39 log-units</text>

  <line x1="96" y1="168" x2="808" y2="168" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="96" y1="168" x2="96" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="96" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1850</text>
  <line x1="237" y1="168" x2="237" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="237" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1800</text>
  <line x1="378" y1="168" x2="378" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="378" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1750</text>
  <line x1="518" y1="168" x2="518" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="518" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1700</text>
  <line x1="659" y1="168" x2="659" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="659" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1650</text>
  <line x1="800" y1="168" x2="800" y2="175" stroke="#7d8590" stroke-width="1"/>
  <text x="800" y="192" font-size="11" fill="#7d8590" text-anchor="middle">-1600</text>
  <circle cx="161" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="158" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="157" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="157" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="155" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="154" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="154" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="154" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="153" cy="168" r="6" fill="#7d8590" fill-opacity="0.55"/>
  <circle cx="743" cy="168" r="9" fill="#2f9e57"/>
  <text x="161" y="216" font-size="13" fill="#7d8590" text-anchor="middle">nine keys</text>
  <text x="743" y="216" font-size="13" fill="#2f9e57" text-anchor="middle">the key</text>
  <text x="743" y="232" font-size="12" fill="#2f9e57" text-anchor="middle">-1620.38</text>

  <text x="240" y="276" font-size="13" fill="#7d8590">the same nine keys, magnified 45 times</text>
  <line x1="240" y1="318" x2="720" y2="318" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="265" y1="318" x2="265" y2="325" stroke="#7d8590" stroke-width="1"/>
  <text x="265" y="342" font-size="11" fill="#7d8590" text-anchor="middle">-1830</text>
