<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img"
     aria-labelledby="reuse-title reuse-desc">
  <title id="reuse-title">What reusing one key gives away</title>
  <desc id="reuse-desc">Two 117-byte messages enciphered under one key with no nonce. A row of 117
    squares, one per byte position, has 107 of them lit, meaning both ciphertexts carry the same
    byte at that position. The 10 unlit squares fall exactly where the two plaintexts differ, so
    the pattern of gaps is handed to anyone watching.</desc>

  <text x="8" y="26" font-size="15" fill="#8b949e">Two messages of 117 bytes, enciphered under one key with no nonce.</text>
  <text x="8" y="48" font-size="13" fill="#7d8590">A lit square means both ciphertexts carry the same byte at that position.</text>
